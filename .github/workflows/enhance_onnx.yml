name: UltraSharp Pro AI Photo Enhancer (ONNX)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID from Vercel API"
        required: true
        type: string

jobs:
  enhance-onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache ONNX model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/ai_weights_onnx
          key: onnx-ultrasharp-both-v3

      - name: Install lightweight ONNX dependencies
        run: pip install --no-cache-dir onnxruntime opencv-python-headless pillow numpy boto3

      - name: Run UltraSharp Pro Photo Enhancer
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: python worker/photo_enhance_onnx.py --job-id "${{ inputs.job_id }}"
