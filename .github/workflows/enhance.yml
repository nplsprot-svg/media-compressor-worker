name: AI Photo HD Enhancer

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID from Vercel API"
        required: true
        type: string

jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip & AI model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ai_weights
            gfpgan/weights
          key: ai-enhance-v2-${{ runner.os }}-py311

      - name: Install CPU PyTorch, Real-ESRGAN and GFPGAN
        run: |
          pip install --upgrade pip
          pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" opencv-python-headless pillow boto3 basicsr facexlib realesrgan gfpgan
          python - << 'PY'
          import pathlib, sysconfig
          deg = pathlib.Path(sysconfig.get_paths()["purelib"]) / "basicsr" / "data" / "degradations.py"
          if deg.exists():
              txt = deg.read_text(encoding="utf-8")
              if "torchvision.transforms.functional_tensor" in txt:
                  deg.write_text(
                      txt.replace("torchvision.transforms.functional_tensor", "torchvision.transforms.functional"),
                      encoding="utf-8",
                  )
                  print("Patched:", deg)
          import basicsr, realesrgan, gfpgan
          print("AI imports OK!")
          PY

      - name: Run AI Photo HD enhancement
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          OMP_NUM_THREADS: "4"
        run: |
          mkdir -p ~/.cache/ai_weights
          AI_WEIGHTS_DIR=~/.cache/ai_weights python worker/photo_enhance.py --job-id "${{ inputs.job_id }}"
